name: Publish Vizmo Self-host Docker Image
run-name: "publish self-host image ${{ github.ref_name }}"

on:
  push:
    tags:
      - "v*-vi.*"

permissions:
  contents: read
  packages: write

concurrency:
  group: publish-vi-selfhost-docker-${{ github.ref_name }}
  cancel-in-progress: false

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.11
      - run: bun install --frozen-lockfile
      - run: bun run format:check
      - run: bun run --cwd packages/plugins/mcp test
      - run: bun run --cwd apps/host-selfhost typecheck
      - run: bun run --cwd apps/host-selfhost build
        env:
          EXECUTOR_ALLOW_STDIO_MCP: "true"

  publish:
    needs: verify
    runs-on: ubuntu-latest
    outputs:
      image: ${{ steps.image.outputs.name }}
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: image
        shell: bash
        run: |
          set -euo pipefail
          owner="$(printf '%s' "$GITHUB_REPOSITORY_OWNER" | tr '[:upper:]' '[:lower:]')"
          image="ghcr.io/${owner}/executor"
          version="${GITHUB_REF_NAME#v}"
          {
            echo "name=${image}"
            echo "tags<<EOF"
            echo "${image}:${GITHUB_REF_NAME}"
            echo "${image}:${version}"
            echo "EOF"
          } >> "$GITHUB_OUTPUT"
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: apps/host-selfhost/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          build-args: EXECUTOR_ALLOW_STDIO_MCP=true
          tags: ${{ steps.image.outputs.tags }}
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.version=${{ github.ref_name }}
  e2e:
    needs: publish
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.11
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: bun install --frozen-lockfile
      - run: bunx playwright install --with-deps chromium chromium-headless-shell
        working-directory: e2e
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - run: bunx vitest run --project selfhost-docker --retry=2
        working-directory: e2e
        env:
          E2E_SELFHOST_DOCKER_IMAGE: ${{ needs.publish.outputs.image }}:${{ github.ref_name }}
