name: Publish Vizmo Executor Docker Image
run-name: "publish Executor image ${{ github.ref_name }}"

on:
  push:
    tags:
      - "v*-vi.*"

permissions:
  contents: read
  packages: write

concurrency:
  group: publish-vi-selfhost-docker-${{ github.ref_name }}
  cancel-in-progress: false

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.11
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: bun install --frozen-lockfile
      - run: bun run format:check
      - run: docker build --pull --file Dockerfile.coolify --tag executor-tools:e2e .
      - run: docker run --rm --entrypoint /usr/local/bin/node executor-tools:e2e --version
      - run: docker run --rm --entrypoint /usr/local/bin/npx executor-tools:e2e --version
      - run: docker run --rm --entrypoint /usr/local/bin/coder executor-tools:e2e version
      - name: Verify SigNoz validates its required runtime secret
        run: |
          set +e
          output="$(docker run --rm --entrypoint /usr/local/bin/signoz-mcp-server executor-tools:e2e --help 2>&1)"
          status=$?
          set -e
          test "$status" -eq 1
          printf '%s\n' "$output"
          grep -Fq "SIGNOZ_API_KEY is required" <<<"$output"
      - run: bunx playwright install --with-deps chromium chromium-headless-shell
        working-directory: e2e
      - run: bunx vitest run --project selfhost-docker --retry=2
        working-directory: e2e
        env:
          E2E_SELFHOST_DOCKER_IMAGE: executor-tools:e2e

  publish:
    needs: verify
    runs-on: ubuntu-latest
    outputs:
      image: ${{ steps.image.outputs.name }}
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: image
        shell: bash
        run: |
          set -euo pipefail
          owner="$(printf '%s' "$GITHUB_REPOSITORY_OWNER" | tr '[:upper:]' '[:lower:]')"
          image="ghcr.io/${owner}/executor"
          version="${GITHUB_REF_NAME#v}"
          {
            echo "name=${image}"
            echo "tags<<EOF"
            echo "${image}:${GITHUB_REF_NAME}"
            echo "${image}:${version}"
            echo "EOF"
          } >> "$GITHUB_OUTPUT"
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile.coolify
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.image.outputs.tags }}
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.version=${{ github.ref_name }}
